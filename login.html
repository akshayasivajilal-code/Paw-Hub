<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PAWHUB | Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">

</head>

<body>

<header>

    <div class="logo">

        <img src="logo.png" alt="Logo">

        <h2>PAWHUB</h2>

    </div>

    <a href="home.html" class="home-btn">← Back to Home</a>

</header>

<section class="login-section">

    <div class="login-left">

        <img src="login-hero.png" alt="Pet">

    </div>

    <div class="login-box">

        <h1>Welcome Back 👋</h1>

        <p>Login to continue your PAWHUB journey.</p>

        <form>

            <div class="input-box">

                <label>Email Address</label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="input-box">

                <label>Password</label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required>

            </div>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button class="login-btn">

                Login

            </button>

        </form>

        <div class="divider">

            <span>OR</span>

        </div>

        <button class="google-btn">

            Continue with Google

        </button>

        <p class="signup">

            Don't have an account?

            <a href="#">Create Account</a>

        </p>

    </div>

</section>

<footer>

    <h3>PAWHUB</h3>

    <p>Every Paw Deserves a Loving Home 🐾</p>

</footer>

</body>

</html>
