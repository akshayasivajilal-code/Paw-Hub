<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PAWHUB | Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Outfit:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: 'Outfit', sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 10% 20%, rgba(191, 219, 254, 0.55), transparent 28%),
                radial-gradient(circle at 90% 80%, rgba(254, 240, 138, 0.35), transparent 30%),
                linear-gradient(135deg, #eff6ff, #ffffff 50%, #fefce8);

            position: relative;
            overflow: hidden;
        }


        /* Decorative paw prints */

        .paw {
            position: absolute;

            font-size: 65px;

            opacity: 0.10;

            user-select: none;

            animation: float 5s ease-in-out infinite;
        }

        .paw1 {
            top: 10%;
            left: 8%;
        }

        .paw2 {
            bottom: 10%;
            right: 8%;
            animation-delay: 1.5s;
        }

        .paw3 {
            top: 18%;
            right: 15%;
            font-size: 42px;
            animation-delay: 0.8s;
        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0) rotate(-8deg);
            }

            50% {
                transform: translateY(-12px) rotate(8deg);
            }
        }


        /* Main container */

        .login-wrapper {

            width: 900px;
            max-width: 92%;

            min-height: 540px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            background: rgba(255, 255, 255, 0.88);

            border: 1px solid rgba(255, 255, 255, 0.9);

            border-radius: 28px;

            overflow: hidden;

            box-shadow:
                0 25px 70px rgba(30, 64, 175, 0.15);

            backdrop-filter: blur(12px);
        }


        /* Left branding section */

        .login-brand {

            background:
                linear-gradient(
                    145deg,
                    #dbeafe,
                    #eff6ff 55%,
                    #fef9c3
                );

            padding: 55px 45px;

            display: flex;
            flex-direction: column;

            justify-content: center;

            position: relative;

            overflow: hidden;
        }

        .login-brand::before {

            content: "";

            position: absolute;

            width: 260px;
            height: 260px;

            border-radius: 50%;

            background: rgba(255,255,255,0.45);

            top: -100px;
            right: -100px;
        }

        .login-brand::after {

            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: rgba(147,197,253,0.25);

            bottom: -80px;
            left: -60px;
        }


        .brand-logo {

            width: 90px;
            height: 90px;

            object-fit: contain;

            margin-bottom: 20px;

            position: relative;
            z-index: 2;
        }


        .login-brand h1 {

            font-family: 'Sora', sans-serif;

            font-size: 42px;

            line-height: 1.15;

            margin: 0 0 15px;

            color: #172554;
        }

        .login-brand h1 span {
            color: #2563eb;
        }


        .login-brand p {

            font-size: 17px;

            line-height: 1.7;

            color: #526581;

            max-width: 330px;

            margin: 0;

            position: relative;
            z-index: 2;
        }


        .brand-tag {

            margin-top: 30px;

            display: inline-flex;

            width: fit-content;

            padding: 9px 16px;

            border-radius: 30px;

            background: rgba(255,255,255,0.75);

            color: #2563eb;

            font-weight: 600;

            font-size: 13px;

            position: relative;
            z-index: 2;
        }


        /* Right login section */

        .login-section {

            padding: 55px 55px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .login-section h2 {

            font-family: 'Sora', sans-serif;

            font-size: 30px;

            color: #172554;

            margin: 0 0 8px;
        }


        .login-subtitle {

            color: #64748b;

            margin: 0 0 30px;

            font-size: 15px;
        }


        /* Input groups */

        .input-group {

            margin-bottom: 18px;
        }


        .input-group label {

            display: block;

            font-size: 13px;

            font-weight: 600;

            color: #334155;

            margin-bottom: 7px;
        }


        .input-box {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 18px;

            opacity: 0.75;
        }


        input {

            width: 100%;

            height: 52px;

            padding: 0 15px 0 46px;

            border: 1.5px solid #dbe4f0;

            border-radius: 13px;

            background: #f8fafc;

            color: #172554;

            font-family: 'Outfit', sans-serif;

            font-size: 15px;

            outline: none;

            transition: all 0.25s ease;
        }


        input:focus {

            border-color: #3b82f6;

            background: white;

            box-shadow:
                0 0 0 4px rgba(59,130,246,0.10);
        }


        input::placeholder {
            color: #94a3b8;
        }


        /* Login button */

        .login-btn {

            width: 100%;

            height: 52px;

            margin-top: 8px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            color: white;

            font-family: 'Outfit', sans-serif;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(37,99,235,0.25);

            transition: all 0.3s ease;
        }


        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(37,99,235,0.32);
        }


        .login-btn:active {
            transform: translateY(0);
        }


        /* Register link */

        .register-text {

            text-align: center;

            margin: 25px 0 0;

            font-size: 14px;

            color: #64748b;
        }


        .register-text a {

            color: #2563eb;

            font-weight: 600;

            text-decoration: none;
        }


        .register-text a:hover {
            text-decoration: underline;
        }


        /* Message */

        #message {

            text-align: center;

            margin: 15px 0 0;

            min-height: 20px;

            font-size: 14px;

            font-weight: 500;
        }


        /* Mobile */

        @media (max-width: 750px) {

            body {
                padding: 25px 0;
            }

            .login-wrapper {

                grid-template-columns: 1fr;

                width: 450px;

                min-height: auto;
            }

            .login-brand {

                padding: 35px;

                text-align: center;

                align-items: center;
            }

            .brand-logo {
                width: 70px;
                height: 70px;
            }

            .login-brand h1 {
                font-size: 32px;
            }

            .login-brand p {
                font-size: 15px;
            }

            .login-section {
                padding: 40px 30px;
            }
        }


        @media (max-width: 480px) {

            .login-wrapper {
                max-width: 94%;
            }

            .login-brand {
                padding: 30px 20px;
            }

            .login-section {
                padding: 30px 22px;
            }

            .login-brand h1 {
                font-size: 28px;
            }

            .login-section h2 {
                font-size: 26px;
            }
        }

    </style>

</head>


<body>

    <!-- Decorative paw prints -->

    <div class="paw paw1">🐾</div>
    <div class="paw paw2">🐾</div>
    <div class="paw paw3">🐾</div>


    <div class="login-wrapper">


        <!-- Branding -->

        <div class="login-brand">

            <img
                src="/images/logo2.png"
                alt="PAWHUB Logo"
                class="brand-logo"
            >

            <h1>
                Welcome to<br>
                <span>PAWHUB</span>
            </h1>

            <p>
                Your trusted place to find loving companions,
                care for your pets, and connect with a community
                that loves every paw.
            </p>

            <div class="brand-tag">
                🐾 For Every Paw
            </div>

        </div>


        <!-- Login -->

        <div class="login-section">

            <h2>Welcome Back! 👋</h2>

            <p class="login-subtitle">
                Login to continue your PawHub journey.
            </p>


            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <span class="input-icon">✉️</span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                </div>

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >

                </div>

            </div>


            <button
                class="login-btn"
                onclick="loginUser()">

                Login to PAWHUB →
                
            </button>


            <p id="message"></p>


            <p class="register-text">

                Don't have an account?
                <a href="/register">
                    Create one
                </a>

            </p>

        </div>

    </div>


    <script>

        function loginUser() {

            const user = {

                email:
                    document.getElementById("email").value,

                password:
                    document.getElementById("password").value

            };


            fetch("/api/users/login", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify(user)

            })

            .then(response => {

                if (!response.ok) {

                    throw new Error("Login failed");

                }

                return response.json();

            })

            .then(data => {

                document.getElementById("message").innerText =
                    "Login successful! 🐾";

                localStorage.setItem(
                    "loggedInUser",
                    JSON.stringify(data)
                );

                setTimeout(() => {

                    window.location.href =
                        "/dashboard";

                }, 500);

            })

            .catch(error => {

                document.getElementById("message").innerText =
                    "Invalid email or password.";

                console.error(error);

            });

        }

    </script>

</body>

</html>
