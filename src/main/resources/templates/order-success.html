<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PAWHUB | Order Success</title>

    <link rel="stylesheet"
          href="/style/order-success.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
          rel="stylesheet">

</head>


<body>


<!-- NAVBAR -->

<header class="navbar">

    <div class="logo-area">

        <div class="logo-paws">
            🐾
        </div>

        <div class="brand-text">

            <strong>PAWHUB</strong>

            <small>
                Pet Care Community
            </small>

        </div>

    </div>

</header>



<!-- SUCCESS -->

<main class="success-page">

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>


        <h1>
            Order Placed Successfully!
        </h1>


        <p class="success-text">
            Thank you for shopping with PAWHUB ❤️
        </p>


        <p class="order-message">
            Your pet essentials are on their way.
            We hope your furry friend loves them! 🐾
        </p>


        <div class="order-box">

            <span>
                Order Status
            </span>

            <strong>
                Confirmed ✓
            </strong>

        </div>


        <div class="success-buttons">

            <button
                class="primary-btn"
                onclick="goMarketplace()">

                Continue Shopping 🛍️

            </button>


            <button
                class="secondary-btn"
                onclick="goHome()">

                Go to Dashboard

            </button>

        </div>

    </div>

</main>



<script>

function goMarketplace() {

    window.location.href =
        "/marketplace";

}


function goHome() {

    window.location.href =
        "/dashboard";

}

</script>


</body>

</html>
