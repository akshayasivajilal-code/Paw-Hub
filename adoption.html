<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAWHUB | Adoption</title>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="adoption.css">
</head>

<body>

<header>

    <div class="logo">
        <img src="logo.png" alt="Logo">
        <h2>PAWHUB</h2>
    </div>

    <a href="home.html" class="home-btn">← Home</a>

</header>

<section class="hero">

    <div class="hero-text">

        <h1>Adopt a Friend ❤️</h1>

        <p>
            Give a loving home to a pet waiting for its forever family.
        </p>

    </div>

    <div class="hero-image">

        <img src="adopt2.jpg" alt="Adoption">

    </div>

</section>

<section class="pets">

    <h2>Available Pets</h2>

    <div class="pet-grid">

        <div class="pet-card">
            <img src="puppy1.jpg" alt="">
            <h3>Buddy</h3>
            <p>Jack Russell</p>
            <button>Adopt Me</button>
        </div>

        <div class="pet-card">
            <img src="puppy2.jpg" alt="">
            <h3>Charlie</h3>
            <p>Golden Retriever</p>
            <button>Adopt Me</button>
        </div>

        <div class="pet-card">
            <img src="puppy3.jpg" alt="">
            <h3>Luna</h3>
            <p>Shetland Sheepdog</p>
            <button>Adopt Me</button>
        </div>

        <div class="pet-card">
            <img src="puppy4.jpg" alt="">
            <h3>Bella</h3>
            <p>Bernese Mountain</p>
            <button>Adopt Me</button>
        </div>

        <div class="pet-card">
            <img src="puppy5.jpg" alt="">
            <h3>Snow</h3>
            <p>Shiba Inu</p>
            <button>Adopt Me</button>
        </div>

        <div class="pet-card">
            <img src="puppy6.jpg" alt="">
            <h3>Rio</h3>
            <p>Labrador Retriever</p>
            <button>Adopt Me</button>
        </div>

    </div>

</section>

<footer>

    <h3>PAWHUB</h3>

    <p>Every Paw Deserves a Loving Home 🐾</p>

</footer>

</body>
</html>
